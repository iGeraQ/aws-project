server.port=8080
spring.application.name=aws-project
spring.profiles.active=jpa
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=true

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mydatabase}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false

# Configuración AWS
aws.accessKeyId=${AWS_ACCESS_KEY_ID:tu_access_key}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:tu_secret_key}
aws.sessionToken=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:tu_bucket_name}
aws.dynamodb.tableName=${DYNAMODB_TABLE_NAME:sesiones-alumnos}
